name: Deploy — Production

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
      JWT_SECRET: test_secret_not_for_production
      JWT_REFRESH_SECRET: test_refresh_secret
      ENCRYPTION_KEY: testencryptionkey12345678901234
      ENCRYPTION_IV: testiv1234567890

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: backend
        run: npm test --if-present

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 via SSM
        uses: aws-actions/aws-ssm-send-command@v1
        with:
          instance-ids: ${{ secrets.EC2_INSTANCE_ID }}
          working-directory: /home/ec2-user/app
          command: |
            cd /home/ec2-user/app
            git pull origin main
            cd backend
            npm ci --omit=dev
            pm2 restart apprenticeship-portal --update-env
            pm2 save

      - name: Health check
        run: |
          sleep 15
          curl --fail ${{ secrets.PRODUCTION_URL }}/api/health || exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deployment failed — check GitHub Actions logs"
