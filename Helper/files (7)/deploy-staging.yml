name: Deploy — Staging

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop

jobs:
  test-and-deploy-staging:
    name: Test + Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      NODE_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linter
        working-directory: backend
        run: npm run lint --if-present

      - name: Run tests
        working-directory: backend
        run: npm test --if-present

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Staging EC2
        uses: aws-actions/aws-ssm-send-command@v1
        with:
          instance-ids: ${{ secrets.STAGING_EC2_INSTANCE_ID }}
          working-directory: /home/ec2-user/app
          command: |
            cd /home/ec2-user/app
            git fetch origin
            git checkout ${{ github.head_ref || github.ref_name }}
            git pull
            cd backend
            npm ci --omit=dev
            pm2 restart apprenticeship-portal-staging --update-env
            pm2 save

      - name: Staging health check
        run: |
          sleep 15
          curl --fail ${{ secrets.STAGING_URL }}/api/health || exit 1
